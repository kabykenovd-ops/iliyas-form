<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Выгрузка EISZ</title>

<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --bg2: var(--tg-theme-secondary-bg-color, #f1f3f5);
    --text: var(--tg-theme-text-color, #1f2328);
    --hint: var(--tg-theme-hint-color, #6b7280);
    --link: var(--tg-theme-link-color, #2481cc);
    --btn: var(--tg-theme-button-color, #2481cc);
    --btn-text: var(--tg-theme-button-text-color, #ffffff);
    --danger: #d93025;
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 12px 12px 90px; background: var(--bg2); color: var(--text);
         font: 15px/1.4 -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  h1 { font-size: 18px; margin: 4px 4px 12px; }
  .card { background: var(--bg); border-radius: 12px; padding: 12px; margin-bottom: 12px; }
  .card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--hint);
             margin: 0 0 10px; font-weight: 600; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .chip { border: 1px solid color-mix(in srgb, var(--hint) 40%, transparent); background: transparent; color: var(--text);
          border-radius: 18px; padding: 7px 12px; font-size: 14px; cursor: pointer; user-select: none; }
  .chip.on { background: var(--btn); color: var(--btn-text); border-color: var(--btn); }
  .chip.small { padding: 5px 9px; font-size: 13px; }
  label.field { display: block; margin: 8px 0 4px; color: var(--hint); font-size: 13px; }
  input, select { width: 100%; padding: 9px 10px; border-radius: 8px; font-size: 15px;
                  border: 1px solid color-mix(in srgb, var(--hint) 35%, transparent);
                  background: var(--bg); color: var(--text); }
  .hidden { display: none !important; }
  .molist { max-height: 46vh; overflow-y: auto; margin-top: 8px; border-radius: 8px;
            border: 1px solid color-mix(in srgb, var(--hint) 20%, transparent); }
  .mo { display: flex; gap: 10px; padding: 9px 10px; border-bottom: 1px solid color-mix(in srgb, var(--hint) 15%, transparent);
        cursor: pointer; align-items: flex-start; }
  .mo:last-child { border-bottom: none; }
  .mo input { width: auto; margin-top: 3px; flex: none; }
  .mo .reg { color: var(--hint); font-size: 12px; }
  .sel { display: flex; justify-content: space-between; gap: 8px; padding: 6px 0;
         border-bottom: 1px dashed color-mix(in srgb, var(--hint) 25%, transparent); font-size: 14px; }
  .sel:last-child { border-bottom: none; }
  .sel button { background: none; border: none; color: var(--danger); font-size: 16px; cursor: pointer; flex: none; }
  .hint { color: var(--hint); font-size: 13px; margin-top: 6px; }
  .linkbtn { background: none; border: none; color: var(--link); padding: 4px 0; font-size: 14px; cursor: pointer; }
  .err { color: var(--danger); font-size: 14px; margin-top: 8px; }
  .fallback { position: fixed; left: 12px; right: 12px; bottom: 12px; padding: 14px; border-radius: 10px; border: none;
              background: var(--btn); color: var(--btn-text); font-size: 16px; font-weight: 600; }
</style>
</head>
<body>
<h1>Выгрузка EISZ</h1>

<div class="card">
  <h2>Отчёты</h2>
  <div class="row" id="reports"></div>
  <div class="row" style="margin-top:8px">
    <button class="chip small" data-preset="24,25">24 + 25 (скрининг)</button>
    <button class="chip small" data-preset="4,11">4 + 11 (КДУ)</button>
    <button class="chip small" data-preset="24,25,4,11">Все</button>
  </div>
</div>

<div class="card" id="card2425">
  <h2>Отчёты 24 / 25</h2>
  <label class="field" for="start">Начало периода</label>
  <input type="date" id="start">
  <div id="splitWrap">
    <label class="field">Разбивка отчёта 24</label>
    <div class="row" id="split"></div>
  </div>
</div>

<div class="card" id="card411">
  <h2>Отчёты 4 / 11</h2>
  <label class="field" for="year">Год</label>
  <input type="number" id="year" min="2020" max="2100">
  <label class="field">Месяцы</label>
  <div class="row" id="monthsMode"></div>
  <div class="row" id="months" style="margin-top:8px"></div>
</div>

<div class="card">
  <h2>МО</h2>
  <div id="selected"></div>
  <div class="hint" id="selHint">Ничего не выбрано</div>
  <label class="field" for="region">Область</label>
  <select id="region"></select>
  <label class="field" for="search">Поиск по названию</label>
  <input type="search" id="search" placeholder="например: поликлиника 5">
  <div class="row" style="margin-top:6px">
    <button class="linkbtn" id="selAllShown">Выбрать все в списке</button>
    <button class="linkbtn" id="clearSel" style="margin-left:auto">Снять все</button>
  </div>
  <div class="molist" id="molist"></div>
  <div class="hint" id="listHint"></div>
</div>

<div class="card" id="cardSvod">
  <h2>Своды</h2>
  <div id="svodWrap">
    <label class="field">Свод скрининга (24 + 25)</label>
    <div class="row" id="svod"></div>
  </div>
  <div id="kduWrap">
    <label class="field">Свод КДУ вне КПН (4 + 11)</label>
    <div class="row" id="kdu"></div>
  </div>
</div>

<div class="card">
  <h2>Когда</h2>
  <div class="row" id="when"></div>
  <div id="onceWrap" class="hidden">
    <label class="field">Дата и время (Астана)</label>
    <div class="row"><input type="date" id="onceDate" style="flex:1"><input type="time" id="onceTime" style="flex:1"></div>
  </div>
  <div id="dailyWrap" class="hidden">
    <label class="field">Время ежедневного запуска (Астана)</label>
    <input type="time" id="dailyTime">
  </div>
</div>

<div class="err" id="err"></div>
<button class="fallback hidden" id="fallbackBtn">Запустить</button>

const save = () => { try { localStorage.setItem("eiszForm", JSON.stringify({lv: DATA.ver, st})); } catch (e) {} };

const $ = id => document.getElementById(id);
const norm = s => s.toLowerCase().replace(/ё/g, "е").replace(/[«»"“”„'`№]/g, " ").replace(/[^\p{L}\p{N}\s]/gu, " ").replace(/\s+/g, " ").trim();
const SEARCH = DATA.mos.map(([ri, name]) => norm(DATA.regions[ri] + " " + name).split(" "));
const has = c => st.r.includes(c);

function chips(container, items, isOn, onClick, small) {
  container.innerHTML = "";
  for (const [val, label] of items) {
    const b = document.createElement("button");
    b.className = "chip" + (small ? " small" : "") + (isOn(val) ? " on" : "");
    b.textContent = label;
    b.onclick = () => { onClick(val); render(); };
    container.appendChild(b);
  }
}

function tokenMatch(tok, words) {
  if (/^\d+$/.test(tok)) return words.includes(tok);
  const stem = tok.length <= 4 ? tok : tok.slice(0, Math.max(4, tok.length - 2));
  return words.some(w => w.startsWith(stem));
}

function shownMos() {
  const q = norm($("search").value);
  const reg = $("region").value;
  const toks = q ? q.split(" ") : [];
  const out = [];
  DATA.mos.forEach(([ri, name], i) => {
    if (reg !== "" && String(ri) !== reg) return;
    if (toks.length && !toks.every(t => tokenMatch(t, SEARCH[i]))) return;
    out.push(i);
  });
  return out;
}

function renderMoList() {
  const list = $("molist");
  const idx = shownMos();
  const reg = $("region").value, q = $("search").value.trim();
  list.innerHTML = "";
  if (reg === "" && !q) {
    list.classList.add("hidden");
    $("listHint").textContent = "Выберите область или начните вводить название МО.";
    $("selAllShown").classList.add("hidden");
    return;
  }
  list.classList.remove("hidden");
  const LIMIT = 150;
  for (const i of idx.slice(0, LIMIT)) {
    const [ri, name] = DATA.mos[i];
    const row = document.createElement("label");
    row.className = "mo";
    const cb = document.createElement("input");
    cb.type = "checkbox"; cb.checked = st.sel.includes(i);
    cb.onchange = () => { toggleSel(i, cb.checked); renderSelected(); updateMain(); save(); };
    const txt = document.createElement("div");
    txt.innerHTML = `<div></div><div class="reg"></div>`;
    txt.children[0].textContent = name;
    txt.children[1].textContent = DATA.regions[ri].split("/").pop().trim();
    row.append(cb, txt);
    list.appendChild(row);
  }
  $("listHint").textContent = idx.length === 0 ? "Ничего не найдено." :
    (idx.length > LIMIT ? `Показаны первые ${LIMIT} из ${idx.length} — уточните поиск.` : `Найдено: ${idx.length}`);
  $("selAllShown").classList.toggle("hidden", idx.length === 0 || idx.length > LIMIT);
  $("selAllShown").textContent = `Выбрать все в списке (${idx.length})`;
}

function toggleSel(i, on) {
  const k = st.sel.indexOf(i);
  if (on && k < 0) st.sel.push(i);
  if (!on && k >= 0) st.sel.splice(k, 1);
}

function renderSelected() {
  const box = $("selected");
  box.innerHTML = "";
  for (const i of st.sel) {
    const [ri, name] = DATA.mos[i];
    const d = document.createElement("div"); d.className = "sel";
    const t = document.createElement("span"); t.textContent = `${name} — ${DATA.regions[ri].split("/").pop().trim()}`;
    const x = document.createElement("button"); x.textContent = "✕";
    x.onclick = () => { toggleSel(i, false); renderSelected(); renderMoList(); updateMain(); save(); };
    d.append(t, x); box.appendChild(d);
  }
  $("selHint").textContent = st.sel.length ? `Выбрано МО: ${st.sel.length}` : "Ничего не выбрано";
}

function render() {
  chips($("reports"), [["24","24 (ДИР)"],["25","25 (Онко)"],["4","4 (КДУ вне КПН)"],["11","11 (Субподряд)"]],
        has, c => { st.r = has(c) ? st.r.filter(x => x !== c) : [...st.r, c]; });
  $("card2425").classList.toggle("hidden", !(has("24") || has("25")));
  $("splitWrap").classList.toggle("hidden", !has("24"));
  $("start").value = st.start;
  chips($("split"), SPLITS, v => st.split === v, v => st.split = v, true);
  $("card411").classList.toggle("hidden", !(has("4") || has("11")));
  $("year").value = st.year;
  chips($("monthsMode"), [["all","Все с начала года"],["pick","Выбрать месяцы"]],
        v => (v === "all") === st.monthsAll, v => st.monthsAll = (v === "all"), true);
  $("months").classList.toggle("hidden", st.monthsAll);
  chips($("months"), MONTHS.map((m, k) => [k + 1, m]), v => st.months.includes(v),
        v => { st.months = st.months.includes(v) ? st.months.filter(x => x !== v) : [...st.months, v].sort((a,b)=>a-b); }, true);
  const s2425 = has("24") && has("25"), s411 = has("4") && has("11");
  $("cardSvod").classList.toggle("hidden", !(s2425 || s411));
  $("svodWrap").classList.toggle("hidden", !s2425);
  $("kduWrap").classList.toggle("hidden", !s411);
  chips($("svod"), SVOD, v => st.svod === v, v => st.svod = v, true);
  chips($("kdu"), SVOD, v => st.kdu === v, v => st.kdu = v, true);
  chips($("when"), WHEN, v => st.when === v, v => st.when = v, true);
  $("onceWrap").classList.toggle("hidden", st.when !== "once");
  $("dailyWrap").classList.toggle("hidden", st.when !== "daily");
  $("onceDate").value = st.onceDate; $("onceTime").value = st.onceTime; $("dailyTime").value = st.dailyTime;
  updateMain(); save();
}

  if (!st.sel.length) errs.push("Выберите хотя бы одну МО.");
  if ((has("24") || has("25")) && !/^\d{4}-\d{2}-\d{2}$/.test(st.start)) errs.push("Укажите дату начала периода для 24/25.");
  if ((has("4") || has("11")) && !st.monthsAll && !st.months.length) errs.push("Выберите месяцы для 4/11.");
  let sch = null;
  if (st.when === "once") {
    if (!st.onceDate || !st.onceTime) errs.push("Укажите дату и время разового запуска.");
    else sch = {k: "once", at: `${dmy(st.onceDate)} ${st.onceTime}`};
  } else if (st.when === "daily") {
    if (!st.dailyTime) errs.push("Укажите время ежедневного запуска.");
    else sch = {k: "daily", t: st.dailyTime};
  }
  const p = {v: 1, lv: DATA.ver, r, s: dmy(st.start || `${year0}-01-01`), sp: st.split,
             y: Number(st.year) || year0, m: st.monthsAll ? null : st.months,
             mo: st.sel, sv: st.svod, kd: st.kdu, sch};
  const json = JSON.stringify(p);
  if (json.length > 4000) errs.push("Слишком много МО в одном задании — разбейте на два.");
  return {errs, json};
}

function mainText() {
  const n = st.sel.length;
  if (st.when === "now") return n ? `Запустить (${n} МО)` : "Выберите МО";
  return n ? `Сохранить расписание (${n} МО)` : "Выберите МО";
}

function updateMain() {
  if (inTelegram) {
    tg.MainButton.setText(mainText());
    tg.MainButton.show();
  } else {
    const b = $("fallbackBtn"); b.classList.remove("hidden"); b.textContent = mainText();
  }
}

function submit() {
  const {errs, json} = buildPayload();
  $("err").textContent = errs.join(" ");
  if (errs.length) { if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("error"); return; }
  if (inTelegram) { tg.sendData(json); }
  else { alert("Откройте форму из Telegram-бота (кнопка «📝 Новая выгрузка»).\n\n" + json); }
}

// события
document.querySelectorAll("[data-preset]").forEach(b => b.onclick = () => { st.r = b.dataset.preset.split(","); render(); });
$("start").onchange = e => { st.start = e.target.value; save(); };
$("year").onchange = e => { st.year = Number(e.target.value) || year0; save(); };
$("onceDate").onchange = e => { st.onceDate = e.target.value; save(); };
$("onceTime").onchange = e => { st.onceTime = e.target.value; save(); };
$("dailyTime").onchange = e => { st.dailyTime = e.target.value; save(); };
$("region").onchange = renderMoList;
$("search").oninput = renderMoList;
$("selAllShown").onclick = () => { shownMos().forEach(i => toggleSel(i, true)); renderSelected(); renderMoList(); updateMain(); save(); };
$("clearSel").onclick = () => { st.sel = []; renderSelected(); renderMoList(); updateMain(); save(); };
$("fallbackBtn").onclick = submit;
if (inTelegram) tg.MainButton.onClick(submit);

// области
const regSel = $("region");
regSel.innerHTML = `<option value="">— все области (только поиск) —</option>` +
  DATA.regions.map((r, i) => `<option value="${i}">${r.split("/").pop().trim()}</option>`).join("");

st.sel = st.sel.filter(i => i >= 0 && i < DATA.mos.length);
renderSelected(); renderMoList(); render();
</script>
